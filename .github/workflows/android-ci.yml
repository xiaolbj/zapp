name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.16.0"

      - name: Install desktop and Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxrandr-dev libx11-dev
          sdkmanager "ndk;25.2.9519653"

      - name: Run Zig checks
        run: |
          zig build test
          zig build check

      - name: Build and verify Android release artifacts
        working-directory: android
        run: |
          chmod +x gradlew
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          ./gradlew lintDebug verifyReleaseArtifacts --no-daemon -PzappVersionCode=1 -PzappVersionName=0.1.0

      - name: Upload unsigned Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.*
